name: Mirroring-pr

on:
  push:
    branches: [main]

jobs:
  to_codecommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            ssh://git-codecommit.ap-south-1.amazonaws.com/v1/repos/isp-codecommit-pr
          ssh_private_key:
            ${{ secrets.ISP_CODECOMMIT_SSH_PRIVATE_KEY_PR }}
          ssh_username:
            ${{ secrets.ISP_CODECOMMIT_SSH_PRIVATE_KEY_ID_PR }}